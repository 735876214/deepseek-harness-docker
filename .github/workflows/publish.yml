name: Build & Publish Image

# 构建并发布 Docker 镜像到 GHCR。
# 触发：
#   - 推送 upstream/* 标签（由 track-update.yml 自动产生）
#   - 手动 workflow_dispatch（可指定 tag，用于首次发布或手动重建）
on:
  push:
    tags:
      - "upstream/*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的镜像标签（默认使用当前 VERSION 文件）"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 打标签触发的流水线需要拉到对应提交
          ref: ${{ github.ref }}

      - name: Read version & commit
        id: ver
        run: |
          VER="${{ github.event.inputs.tag }}"
          if [ -z "$VER" ]; then VER=$(cat VERSION | tr -d '[:space:]'); fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          COMMIT=$(grep '^UPSTREAM_COMMIT=' UPSTREAM_VERSION | cut -d= -f2-)
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "publishing version=$VER commit=$COMMIT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:upstream-${{ steps.ver.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Packaged DeepSeek Harness (dsh) for Docker
            org.opencontainers.image.licenses=MIT
            io.deepseek.upstream.repo=https://github.com/deepseek-ai/deepseek-harness
            io.deepseek.upstream.version=${{ steps.ver.outputs.version }}
            io.deepseek.upstream.commit=${{ steps.ver.outputs.commit }}

      - name: Ensure package is public
        # GHCR 包默认可能为私有，显式设为公开，保证他人可 docker pull
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "user/packages/container/deepseek-harness-docker/visibility" \
            -f visibility=public || true
