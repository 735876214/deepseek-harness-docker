name: Build & Publish Image

# 构建并发布 Docker 镜像到 GHCR。
# 触发：
#   - 推送 upstream/* 标签（由 track-update.yml 自动产生）
#   - 手动 workflow_dispatch（可指定 tag，用于首次发布或手动重建）
on:
  push:
    tags:
      - "upstream/*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的镜像标签（默认使用当前 VERSION 文件）"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 打标签触发的流水线需要拉到对应提交
          ref: ${{ github.ref }}

      - name: Read version & commit
        id: ver
        run: |
          VER="${{ github.event.inputs.tag }}"
          if [ -z "$VER" ]; then VER=$(cat VERSION | tr -d '[:space:]'); fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          COMMIT=$(grep '^UPSTREAM_COMMIT=' UPSTREAM_VERSION | cut -d= -f2-)
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "publishing version=$VER commit=$COMMIT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:upstream-${{ steps.ver.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Packaged DeepSeek Harness (dsh) for Docker
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            io.deepseek.upstream.repo=https://github.com/deepseek-ai/deepseek-harness
            io.deepseek.upstream.version=${{ steps.ver.outputs.version }}
            io.deepseek.upstream.commit=${{ steps.ver.outputs.commit }}

      - name: Verify package visibility
        # GHCR 包首次创建时可能是 private，外部将无法 docker pull。
        # 注意：GitHub 并没有「修改用户包可见性」的 REST 端点（PUT/PATCH .../visibility
        # 均返回 404），因此这里只做校验并显式告警，不再假装设置成功。
        # 若为 private，请在 包页面 → Package settings → Change visibility 一次性改为 public。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="deepseek-harness-docker"
          VIS=$(gh api "user/packages/container/$PKG" --jq .visibility 2>/dev/null || echo unknown)
          echo "package visibility: $VIS"
          if [ "$VIS" = "private" ]; then
            echo "::warning::GHCR 包 $PKG 当前为 private，外部 docker pull 会失败；请到包设置里改为 public（一次性）。"
          fi
