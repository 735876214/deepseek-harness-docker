name: Track Upstream & Tag

# 自动跟踪上游版本变化：每 6 小时检查一次，也可手动触发。
# 仅由 schedule / workflow_dispatch 触发，避免提交自循环。
#
# 版本模型：打包版本 = <上游版本>-r<打包修订号>（如 0.2.2-alpha.3-r2）
#   - 上游发新版本            -> 修订号重置为 1，打 tag upstream/<上游版本>-r1
#   - 上游未变、force 重新打包 -> 修订号 +1，打 tag upstream/<上游版本>-rN
# 每次发版都打一次性 git 标签，与镜像的不可变标签 <打包版本> 一一对应。
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "即使上游无变化也递增打包修订号（rN+1）、重新打标签并触发发布"
        type: boolean
        default: false

permissions:
  contents: write
  # 需要显式触发 publish.yml：用 GITHUB_TOKEN 推送 tag 不会自动触发其他工作流，
  # 因此这里改为主动 dispatch（见最后一步）。
  actions: write

jobs:
  track:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.track.outputs.status }}
      packaging_version: ${{ steps.prep.outputs.packaging_version }}
      changed: ${{ steps.prep.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Track upstream
        id: track
        run: |
          bash scripts/track-upstream.sh
          STATUS=$(python3 -c "import json;print(json.load(open('track_result.json')).get('status'))")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "track status: $STATUS"

      - name: Prepare packaging version
        # 有新上游版本 -> r1；force -> rN+1；否则不动文件。
        id: prep
        env:
          FORCE: ${{ inputs.force }}
        run: python3 scripts/prepare-packaging-version.py

      - name: Commit & tag
        if: ${{ steps.prep.outputs.changed == 'true' }}
        env:
          PKG_VER: ${{ steps.prep.outputs.packaging_version }}
        run: |
          set -euo pipefail
          echo "packaging version: $PKG_VER"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION PACKAGING_REVISION UPSTREAM_VERSION Dockerfile CHANGELOG.md
          if git diff --cached --quiet; then
            echo "no version file changes; skip commit"
          else
            git commit -m "chore(release): 打包 $PKG_VER"
            git push origin HEAD
          fi
          # 标签应当唯一（修订号每次递增）；若已存在（重复触发）则跳过，避免 push 失败
          if git ls-remote --tags origin "upstream/$PKG_VER" | grep -q .; then
            echo "tag upstream/$PKG_VER already exists on remote; skip"
          else
            git tag -a "upstream/$PKG_VER" -m "Packaged deepseek-harness $PKG_VER"
            git push origin "upstream/$PKG_VER"
          fi

      - name: Trigger image publish
        # 关键：GITHUB_TOKEN 推送 tag 不会产生新的 workflow run，
        # 因此必须显式 dispatch publish.yml，否则「自动发版」链条是断的。
        if: ${{ steps.prep.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_VER: ${{ steps.prep.outputs.packaging_version }}
        run: |
          set -euo pipefail
          echo "dispatching publish.yml with tag=$PKG_VER"
          gh workflow run publish.yml --ref "${GITHUB_REF_NAME:-main}" -f tag="$PKG_VER"
