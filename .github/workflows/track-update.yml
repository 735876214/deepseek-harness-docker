name: Track Upstream & Tag

# 自动跟踪上游版本变化：每 6 小时检查一次，也可手动触发。
# 仅由 schedule / workflow_dispatch 触发，避免提交自循环。
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "即使无变化也重新打标签并触发发布"
        type: boolean
        default: false

permissions:
  contents: write
  # 需要显式触发 publish.yml：用 GITHUB_TOKEN 推送 tag 不会自动触发其他工作流，
  # 因此这里改为主动 dispatch（见最后一步）。
  actions: write

jobs:
  track:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.track.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Track upstream
        id: track
        run: |
          bash scripts/track-upstream.sh
          STATUS=$(python3 -c "import json;print(json.load(open('track_result.json')).get('status'))")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "track status: $STATUS"

      - name: Update packaged version files
        id: update
        # 只在「上游确有新版本」时改写文件；force 仅用于重新打标签/重新发布，
        # 不应重写 CHANGELOG（否则同一版本会不断追加重复条目）。
        if: ${{ steps.track.outputs.status == 'UPDATE' }}
        run: |
          python3 - <<'PY'
          import json, re, datetime, os
          r = json.load(open('track_result.json'))
          ver = r['version']; tag = r['tag']; commit = r['commit']
          npm = r.get('npm_version') or ver
          today = datetime.date.today().isoformat()

          lines = [
              "# 上游版本溯源真值（由 scripts/track-upstream.sh 自动维护）",
              f"UPSTREAM_TAG={tag}",
              f"UPSTREAM_VERSION={ver}",
              f"UPSTREAM_COMMIT={commit}",
              "UPSTREAM_REPO=https://github.com/deepseek-ai/deepseek-harness",
              f"NPM_VERSION={npm}",
              f"TRACKED_AT={today}",
          ]
          open('UPSTREAM_VERSION', 'w').write("\n".join(lines) + "\n")
          open('VERSION', 'w').write(ver + "\n")

          df = open('Dockerfile').read()
          df = re.sub(r'ARG DSH_VERSION=[^\n]*', 'ARG DSH_VERSION=' + ver, df, count=1)
          open('Dockerfile', 'w').write(df)

          entry = (
              f"## {ver}\n"
              f"- 上游 tag：`{tag}`\n"
              f"- 上游 commit：`{commit}`\n"
              f"- npm 版本：`{npm}`\n"
              f"- 封装时间：{today}\n\n"
          )
          ch = open('CHANGELOG.md').read()
          idx = ch.find("## ", ch.find("# Changelog"))
          body = ch[:idx] if idx > 0 else ch
          open('CHANGELOG.md', 'w').write(body + entry)
          print("updated files for", ver)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"version={ver}\n")
          PY

      - name: Commit & tag
        if: ${{ steps.track.outputs.status == 'UPDATE' || inputs.force }}
        env:
          VER: ${{ steps.update.outputs.version }}
        run: |
          set -e
          if [ -z "$VER" ]; then
            VER=$(grep '^UPSTREAM_VERSION=' UPSTREAM_VERSION | cut -d= -f2-)
          fi
          echo "version under packaging: $VER"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION UPSTREAM_VERSION Dockerfile CHANGELOG.md
          if git diff --cached --quiet; then
            echo "no version file changes; skip commit"
          else
            git commit -m "chore: track upstream $VER"
            git push origin HEAD
          fi
          # 标签可能已存在（force 重跑），已存在则跳过，避免 push 失败
          if git ls-remote --tags origin "upstream/$VER" | grep -q .; then
            echo "tag upstream/$VER already exists on remote; skip"
          else
            git tag -a "upstream/$VER" -m "Packaged deepseek-harness $VER (upstream $VER)"
            git push origin "upstream/$VER"
          fi

      - name: Trigger image publish
        # 关键：GITHUB_TOKEN 推送 tag 不会产生新的 workflow run，
        # 因此必须显式 dispatch publish.yml，否则「自动发版」链条是断的。
        if: ${{ steps.track.outputs.status == 'UPDATE' || inputs.force }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.update.outputs.version }}
        run: |
          set -e
          if [ -z "$VER" ]; then
            VER=$(grep '^UPSTREAM_VERSION=' UPSTREAM_VERSION | cut -d= -f2-)
          fi
          echo "dispatching publish.yml with tag=$VER"
          gh workflow run publish.yml --ref "${GITHUB_REF_NAME:-main}" -f tag="$VER"
