# DeepSeek Harness (dsh) —— Docker Compose 启动配置
#
# 用法：
#   cp config/dsh.env.example .env   # 按需修改配置
#   docker compose up -d
#
# 说明：
#   - 镜像默认拉取 :latest（始终为最新已封装的上游版本）。
#     也可在 .env 中把 IMAGE_TAG 固定为不可变打包版本，例如 0.2.2-alpha.3-r2（推荐），
#     或上游版本 0.2.2-alpha.3（浮动别名）、upstream-05b1cae。
#   - 数据持久化在命名卷 dsh-data（对应容器内 /data = $DSH_HOME）。
#   - 仅 amd64 架构。

services:
  dsh:
    image: ghcr.io/735876214/deepseek-harness-docker:${IMAGE_TAG:-latest}
    container_name: deepseek-harness
    restart: unless-stopped
    # 每次 up 都尝试拉取最新镜像，保证上游更新后一键升级
    pull_policy: always
    ports:
      - "${DSH_PORT:-3080}:3080"
    environment:
      DSH_PROFILE: "${DSH_PROFILE:-web}"
      # 对外暴露端口（鉴权网关监听此处）
      DSH_PORT: "${DSH_PORT:-3080}"
      # dsh web 实际运行的内部端口（仅回环；其 token 由网关自动抓取并注入转发）
      DSH_DSH_PORT: "${DSH_DSH_PORT:-3081}"
      DSH_HOME: "/data"
      DSH_EXTRA_ARGS: "${DSH_EXTRA_ARGS:-}"
      # 登录页访问口令：留空 = 容器启动随机生成并打印到日志（docker logs 查看）
      DSH_LOGIN_PASSWORD: "${DSH_LOGIN_PASSWORD:-}"
      # 会话签名密钥：留空 = 每次启动随机（重启后需重新登录）
      DSH_SESSION_SECRET: "${DSH_SESSION_SECRET:-}"
      # 在 TLS 反向代理之后运行时设为 1，给 Cookie 加 Secure 标记
      DSH_SECURE_COOKIE: "${DSH_SECURE_COOKIE:-}"
      # 登录暴力破解防护：同 IP 连续失败次数上限 / 锁定时长（秒）
      DSH_LOGIN_MAX_FAILS: "${DSH_LOGIN_MAX_FAILS:-8}"
      DSH_LOGIN_LOCK_SECONDS: "${DSH_LOGIN_LOCK_SECONDS:-300}"
      TZ: "${TZ:-Asia/Shanghai}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
    volumes:
      - dsh-data:/data

volumes:
  dsh-data:
